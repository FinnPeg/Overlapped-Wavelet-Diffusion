data:
    type: "LLdataset"
    train_dataset: "LOLv1"
    val_dataset: "LOLv1"
    #(bior44_level1)
   patch_size: 248
    #(haar)
#    patch_size: 256
    #(bior22_level2)
#    patch_size: 244
    #(bior22_level1)
#    patch_size: 252
    channels: 3
    num_workers: 8
    data_dir: "/home/user/Desktop/data/Diffusion-Low-Light/datasets"
    ckpt_dir: "ckpt/"
    conditional: True

model:
    in_channels: 3
    out_ch: 3
    ch: 64
    ch_mult: [1, 2, 3, 4]
    num_res_blocks: 2
    dropout: 0.0
    ema_rate: 0.999
    ema: True
    resamp_with_conv: True

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 200

training:
   batch_size: 4
    # batch_size: 16
   n_epochs: 1000
    validation_freq: 1000

optim:
    weight_decay: 0.000
    optimizer: "Adam"
   lr: 0.0001
#    lr: 0.0002
    amsgrad: False
    eps: 0.00000001
    step_size: 50
    gamma: 0.8

